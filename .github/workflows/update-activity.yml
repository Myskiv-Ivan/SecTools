name: Update activity dates

on:
  schedule:
    # Mondays 06:15 UTC
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh README activity dates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-activity.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md data/activity.json; then
            echo "No activity changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/activity.json
          git commit -m "chore: refresh GitHub activity dates"
          git push
